name: Deploy Mini Arcade Hub web version

on:
  push:
    branches: [main]
    paths:
      - "web-version/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies from lockfile
        working-directory: web-version
        run: npm ci
      - name: Audit installed dependencies (report only; dev-tool findings do not block)
        working-directory: web-version
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const counts=a.metadata?.vulnerabilities || {}; console.log("NPM audit summary:", JSON.stringify(counts)); for (const [name,v] of Object.entries(a.vulnerabilities || {})) { console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,advisories:(v.via || []).filter(x => typeof x === "object").map(x => ({title:x.title,url:x.url,range:x.range}))})); }'
      - name: Fail on high-severity problems in shipped dependencies
        working-directory: web-version
        run: npm audit --omit=dev --audit-level=high
      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: web-dependency-audit
          path: web-version/npm-audit.json
          if-no-files-found: error
      - name: Test game logic
        working-directory: web-version
        run: npm test
      - name: Build website
        working-directory: web-version
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-version/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
