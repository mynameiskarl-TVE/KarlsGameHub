name: Build Mini Arcade Hub Android test APK

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: "android-test-build"
  cancel-in-progress: false

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36

      - name: Refresh dependency lockfile
        working-directory: web-version
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        working-directory: web-version
        run: npm ci

      - name: Run application tests
        working-directory: web-version
        run: npm test

      - name: Generate Android project
        working-directory: web-version
        run: npm run capacitor:add:android

      - name: Build and sync web assets
        working-directory: web-version
        run: npm run capacitor:sync

      - name: Build Android debug APK
        working-directory: web-version/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Arcade-Hub-Android-debug
          path: web-version/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
